# Local WordPress for developing and verifying the plugin. Not shipped in the plugin zip.
name: mwc-dev
services:
  db:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
      MARIADB_ROOT_PASSWORD: wordpress
    volumes:
      - db:/var/lib/mysql
  wordpress:
    image: wordpress:7.1.4-apache
    depends_on: [db]
    ports:
      - "4230:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DEBUG: "1"
    volumes:
      - wp:/var/www/html
      - ..:/var/www/html/wp-content/plugins/geniusbrain-media-webp-compressor
      - ./mu-plugins:/var/www/html/wp-content/mu-plugins
  cli:
    image: wordpress:cli
    profiles: [cli]
    user: "33:33"
    depends_on: [db, wordpress]
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - wp:/var/www/html
      - ..:/var/www/html/wp-content/plugins/geniusbrain-media-webp-compressor
volumes:
  db:
  wp:
